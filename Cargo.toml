[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
captaine-time = { path = "crates/time" }
captaine-model = { path = "crates/model" }
captaine-ops = { path = "crates/ops" }
captaine-media = { path = "crates/media" }
captaine-export = { path = "crates/export" }
clap = { version = "4", features = ["derive"] }
captaine-render = { path = "crates/render" }
captaine-audio = { path = "crates/audio" }
png = "0.17"
ebur128 = "0.1"
