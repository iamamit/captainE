[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
captaine-time = { path = "crates/time" }
captaine-model = { path = "crates/model" }
captaine-ops = { path = "crates/ops" }
captaine-media = { path = "crates/media" }
captaine-export = { path = "crates/export" }
clap = { version = "4", features = ["derive"] }
captaine-render = { path = "crates/render" }
captaine-audio = { path = "crates/audio" }
png = "0.17"
ebur128 = "0.1"
captaine-project = { path = "crates/project" }
eframe = "0.36"
egui = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
rfd = "0.17"
cpal = "0.18"
captaine-agent = { path = "crates/agent" }
ureq = "3"
captaine-vcs = { path = "crates/vcs" }
captaine-interchange = { path = "crates/interchange" }
captaine-speech = { path = "crates/speech" }
captaine-vision = { path = "crates/vision" }
blake3 = "1"
