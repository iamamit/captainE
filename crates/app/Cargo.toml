[package]
name = "captaine-app"
description = "The captainE editor window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "captaine_app"

[[bin]]
name = "captaine-app"
path = "src/main.rs"

[dependencies]
captaine-time.workspace = true
captaine-model.workspace = true
captaine-ops.workspace = true
captaine-project.workspace = true
captaine-media.workspace = true
captaine-render.workspace = true
png.workspace = true
captaine-audio.workspace = true
captaine-export.workspace = true
captaine-agent.workspace = true
captaine-interchange.workspace = true
captaine-speech.workspace = true
captaine-plugins = { path = "../plugins" }
serde.workspace = true
serde_json.workspace = true
captaine-vision.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
arboard.workspace = true
cpal.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
clack-host = { git = "https://github.com/prokopyl/clack", features = ["clack-plugin"] }
clack-plugin = { git = "https://github.com/prokopyl/clack" }
clack-plugin-gain = { git = "https://github.com/prokopyl/clack" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

