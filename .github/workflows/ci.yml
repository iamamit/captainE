name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg and build libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libssl-dev pkg-config
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: License check (CONTRIBUTING.md rule 3)
        if: runner.os == 'Linux'
        run: python3 tools/license_check.py
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        if: runner.os != 'macOS'
        timeout-minutes: 25
        run: cargo test --workspace --no-fail-fast -- --test-threads=4
      # The hosted Mac runner (3 cores, 7 GB) stopped responding during the parallel run: one crate at a
      # time, one test at a time, so a stall names its crate in the log.
      - name: Test (macOS, crate by crate)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: |
          for c in $(ls crates); do
            echo "::group::captaine-$c"; date
            cargo test -p captaine-$c --no-fail-fast -- --test-threads=1 || echo "FAILED captaine-$c" >> failed.txt
            echo "::endgroup::"
          done
          if [ -f failed.txt ]; then cat failed.txt; exit 1; fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets
